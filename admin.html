<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard Slot | Kalaila Photography</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            background: var(--bg-warm);
            color: var(--text-color);
            min-height: 100vh;
        }

        .admin-nav {
            background: var(--white);
            border-bottom: 1px solid var(--border-color);
            padding: 18px 0;
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.04);
        }

        .admin-nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-logo h2 {
            font-family: var(--font-serif);
            font-size: 1.6rem;
            color: var(--primary-color);
            display: inline-block;
        }

        .admin-logo span {
            font-size: 0.72rem;
            color: var(--gold-accent);
            letter-spacing: 2px;
            margin-left: 10px;
            text-transform: uppercase;
        }

        .admin-user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-admin-logout {
            background: #fef5f5;
            color: #c0392b;
            border: 1px solid #e74c3c;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: var(--transition);
        }

        .btn-admin-logout:hover {
            background: #e74c3c;
            color: #fff;
        }

        .admin-main {
            padding: 48px 0;
        }

        .admin-grid-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 36px;
        }

        .stat-card-admin {
            background: var(--white);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: var(--shadow-sm);
        }

        .stat-card-admin i {
            font-size: 2.2rem;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-card-admin.booked i {
            background: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
        }

        .stat-card-admin.limited i {
            background: rgba(241, 196, 15, 0.1);
            color: #f1c40f;
        }

        .stat-card-admin.available i {
            background: rgba(46, 204, 113, 0.1);
            color: #2ecc71;
        }

        .stat-info h4 {
            font-size: 1.8rem;
            font-family: var(--font-serif);
            color: var(--primary-color);
        }

        .stat-info p {
            font-size: 0.85rem;
            color: var(--light-text);
        }

        .admin-slot-card {
            background: var(--white);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 36px;
            box-shadow: var(--shadow-md);
        }

        .admin-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .admin-card-header h3 {
            font-family: var(--font-serif);
            font-size: 1.6rem;
            color: var(--primary-color);
        }

        .admin-notice {
            background: var(--gold-light);
            border: 1px solid rgba(201, 169, 110, 0.3);
            color: var(--primary-color);
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .calendar-dates-grid-admin {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
        }

        .date-chip-admin {
            background: var(--bg-warm);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 14px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .date-chip-admin:hover {
            transform: scale(1.04);
            border-color: var(--gold-accent);
            box-shadow: var(--shadow-sm);
        }

        .date-chip-admin .day-num {
            font-weight: 700;
            font-size: 1.2rem;
            display: block;
            margin: 2px 0;
            color: var(--primary-color);
        }

        .date-chip-admin .day-name {
            font-size: 0.72rem;
            color: var(--light-text);
            display: block;
            text-transform: uppercase;
        }

        .date-chip-admin .status-badge-admin {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 50px;
            display: inline-block;
            margin-top: 4px;
        }

        .date-chip-admin.status-available .status-badge-admin {
            background: rgba(46, 204, 113, 0.12);
            color: #27ae60;
            border: 1px solid rgba(46, 204, 113, 0.3);
        }

        .date-chip-admin.status-limited .status-badge-admin {
            background: rgba(241, 196, 15, 0.12);
            color: #d35400;
            border: 1px solid rgba(241, 196, 15, 0.3);
        }

        .date-chip-admin.status-booked {
            background: rgba(231, 76, 60, 0.04);
            border-color: rgba(231, 76, 60, 0.2);
        }

        .date-chip-admin.status-booked .status-badge-admin {
            background: rgba(231, 76, 60, 0.1);
            color: #c0392b;
            border: 1px solid rgba(231, 76, 60, 0.2);
        }

        .btn-reset-slots {
            background: var(--bg-warm);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-reset-slots:hover {
            background: var(--primary-color);
            color: var(--white);
            border-color: var(--primary-color);
        }
    </style>
</head>
<body>

    <!-- Auth Guard Check -->
    <script>
        if (sessionStorage.getItem('kalaila_admin_logged_in') !== 'true') {
            window.location.href = 'admin-login.html';
        }
    </script>

    <!-- Admin Navbar -->
    <nav class="admin-nav">
        <div class="container admin-nav-container">
            <div class="admin-logo">
                <h2>KALAILA</h2>
                <span>ADMIN PANEL</span>
            </div>
            <div class="admin-user-info">
                <span><i class="fas fa-user-circle" style="color: var(--gold-accent);"></i> Owner/Admin Logged In</span>
                <a href="availability.html" target="_blank" style="color: var(--gold-accent); font-size: 0.88rem; text-decoration: underline;"><i class="fas fa-external-link-alt"></i> Lihat Halaman Klien</a>
                <button onclick="logoutAdmin()" class="btn-admin-logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Admin Content -->
    <main class="admin-main">
        <div class="container">

            <!-- Stats Overview -->
            <div class="admin-grid-stats">
                <div class="stat-card-admin booked">
                    <i class="fas fa-times-circle"></i>
                    <div class="stat-info">
                        <h4 id="cntBooked">0</h4>
                        <p>Tanggal Full Booked</p>
                    </div>
                </div>

                <div class="stat-card-admin available">
                    <i class="fas fa-check-circle"></i>
                    <div class="stat-info">
                        <h4 id="cntAvailable">0</h4>
                        <p>Tanggal Masih Tersedia</p>
                    </div>
                </div>
            </div>

            <!-- Slot Manager Card -->
            <div class="admin-slot-card">
                <div class="admin-card-header">
                    <h3><i class="far fa-calendar-alt"></i> Pengaturan Ketersediaan Slot Bulan Ini</h3>
                    <button onclick="resetDefaultSlots()" class="btn-reset-slots">
                        <i class="fas fa-undo"></i> Reset Ke Default
                    </button>
                </div>



                <!-- Admin Interactive Calendar Grid -->
                <div class="calendar-dates-grid-admin" id="adminCalendarGrid"></div>
            </div>

        </div>
    </main>

    <script>
        // Slot Data Manager
        let defaultDaySlots = {
            6: 0, 12: 0, 18: 0, 25: 0,
            3: 1, 8: 1, 14: 1, 20: 1, 27: 1, 29: 1,
            2: 2, 5: 2, 9: 2, 15: 2, 22: 2, 28: 2
        };

        let savedSlots = localStorage.getItem('kalaila_day_slots');
        let daySlotsMap = savedSlots ? JSON.parse(savedSlots) : defaultDaySlots;

        function getRemainingSlots(day) {
            if (daySlotsMap.hasOwnProperty(day)) {
                return parseInt(daySlotsMap[day]);
            }
            return 3;
        }

        function renderAdminGrid() {
            const grid = document.getElementById('adminCalendarGrid');
            if (!grid) return;

            const today = new Date();
            const year = today.getFullYear();
            const month = today.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const dayNames = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];

            let html = '';
            let cntA = 0, cntB = 0, cntL = 0;

            for (let day = 1; day <= daysInMonth; day++) {
                const dateObj = new Date(year, month, day);
                const dayName = dayNames[dateObj.getDay()];
                const slots = getRemainingSlots(day);

                let statusClass = 'status-available';
                let badgeText = `Sisa ${slots} Slot`;

                if (slots === 0) {
                    statusClass = 'status-booked';
                    badgeText = 'Full Booked';
                    cntB++;
                } else if (slots <= 2) {
                    statusClass = 'status-limited';
                    badgeText = `Sisa ${slots} Slot`;
                    cntL++;
                } else {
                    cntA++;
                }

                html += `
                    <div class="date-chip-admin ${statusClass}" data-day="${day}">
                        <span class="day-name">${dayName}</span>
                        <span class="day-num">${day}</span>
                        <span class="status-badge-admin">${badgeText}</span>
                    </div>
                `;
            }

            grid.innerHTML = html;

            if (document.getElementById('cntBooked')) document.getElementById('cntBooked').textContent = cntB;
            if (document.getElementById('cntAvailable')) document.getElementById('cntAvailable').textContent = cntA + cntL;

            document.querySelectorAll('.date-chip-admin').forEach(chip => {
                chip.addEventListener('click', function () {
                    const dayNum = parseInt(this.getAttribute('data-day'));
                    let curSlots = getRemainingSlots(dayNum);
                    curSlots = (curSlots > 0) ? curSlots - 1 : 3;
                    daySlotsMap[dayNum] = curSlots;

                    localStorage.setItem('kalaila_day_slots', JSON.stringify(daySlotsMap));
                    renderAdminGrid();
                });
            });
        }

        function resetDefaultSlots() {
            if (confirm('Apakah Anda yakin ingin mengembalikan pengaturan slot ke awal?')) {
                daySlotsMap = {
                    6: 0, 12: 0, 18: 0, 25: 0,
                    3: 1, 8: 1, 14: 1, 20: 1, 27: 1, 29: 1,
                    2: 2, 5: 2, 9: 2, 15: 2, 22: 2, 28: 2
                };
                localStorage.setItem('kalaila_day_slots', JSON.stringify(daySlotsMap));
                renderAdminGrid();
            }
        }

        function logoutAdmin() {
            sessionStorage.removeItem('kalaila_admin_logged_in');
            window.location.href = 'index.html';
        }

        renderAdminGrid();
    </script>
</body>
</html>
